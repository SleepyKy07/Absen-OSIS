<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Absen OSIS</title><style>*{box-sizing:border-box}body{font-family:system-ui,sans-serif;margin:0;background:#f3f4f6;color:#111}header{background:#1e3a8a;color:#fff;padding:14px 16px}header h1{margin:0;font-size:18px}nav{display:flex;gap:8px;padding:10px 16px;background:#fff;position:sticky;top:0;border-bottom:1px solid #ddd}nav button{flex:1;padding:10px;border:1px solid #ccc;border-radius:8px;background:#f9fafb;cursor:pointer}nav button.on{background:#1e3a8a;color:#fff;border-color:#1e3a8a}main{padding:16px;max-width:720px;margin:auto}section{display:none}section.on{display:block}.card{background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:12px;margin-bottom:12px}input,select{width:100%;padding:9px;margin:4px 0 8px;border:1px solid #ccc;border-radius:8px}.row{display:flex;gap:8px}.row>*{flex:1}button.act{padding:9px 12px;border-radius:8px;border:1px solid #ccc;background:#f9fafb;cursor:pointer}button.pri{background:#16a34a;color:#fff;border-color:#16a34a}button.dan{background:#fee2e2;border-color:#fca5a5}.st{display:flex;gap:4px;flex-wrap:wrap}.st button{flex:1;min-width:60px;padding:8px;border-radius:8px;border:1px solid #ccc;background:#fff;cursor:pointer}.st button.s{background:#1e3a8a;color:#fff;border-color:#1e3a8a}table{width:100%;border-collapse:collapse;font-size:14px}td,th{border-bottom:1px solid #eee;padding:8px 4px;text-align:left}.mut{color:#666;font-size:13px}</style></head><body><header><h1>Absen OSIS</h1><div class="mut" style="color:#bfdbfe">Data hanya di browser ini (localStorage)</div></header><nav><button data-t="absen" class="on">Absen</button><button data-t="anggota">Anggota</button><button data-t="rekap">Rekap</button></nav><main><section id="absen" class="on"><div class="card"><label>Tanggal</label><input type="date" id="tgl"><div class="row"><button class="act" id="allH">Semua hadir</button><button class="act pri" id="save">Simpan</button></div><div class="mut" id="saveMsg"></div></div><div id="absenList"></div></section><section id="anggota"><div class="card"><input id="nama" placeholder="Nama anggota"><input id="divisi" placeholder="Divisi / jabatan (opsional)"><input id="tel" type="tel" inputmode="tel" placeholder="No. HP, cth 0812... (opsional)"><button class="act pri" id="addM" style="width:100%">+ Tambah anggota</button></div><div class="card"><b>Impor CSV</b><div class="mut">Format per baris: nama,divisi,telepon. Baris header (nama,...) boleh ada. Dari Excel: Save As CSV.</div><div class="row" style="margin-top:8px"><input type="file" id="impFile" accept=".csv,text/csv"><button class="act" id="impBtn">Impor</button></div><div class="mut" id="impMsg"></div></div><div id="memList"></div><div class="card"><b>Backup</b><div class="row"><button class="act" id="bak">Backup JSON</button><button class="act" id="exp">Export CSV</button></div><div class="row" style="margin-top:8px"><input type="file" id="resFile" accept=".json"><button class="act" id="res">Restore</button></div></div></section><section id="rekap"><div class="card"><div class="row"><div><label>Dari</label><input type="date" id="d1"></div><div><label>Sampai</label><input type="date" id="d2"></div></div></div><div class="card" id="rekapOut"></div></section></main><script>const K='osisAbsenV1';let DB=JSON.parse(localStorage.getItem(K)||'{"members":[],"records":{}}');const $=id=>document.getElementById(id);const save=()=>localStorage.setItem(K,JSON.stringify(DB));const today=()=>new Date().toISOString().slice(0,10);const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);const telOf=m=>m.tel||'';if(!$('tgl').value)$('tgl').value=today();document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav button').forEach(x=>x.classList.remove('on'));document.querySelectorAll('section').forEach(x=>x.classList.remove('on'));b.classList.add('on');$(b.dataset.t).classList.add('on');if(b.dataset.t==='rekap')renderRekap();});const cleanTel=v=>String(v||'').trim();$('addM').onclick=()=>{const n=$('nama').value.trim();if(!n)return alert('Isi nama dulu');const t=cleanTel($('tel').value);if(t&&!/^[0-9+()\-.\s]+$/.test(t))return alert('No. HP hanya boleh angka, +, -, spasi, tanda kurung');DB.members.push({id:uid(),nama:n,divisi:$('divisi').value.trim(),tel:t});$('nama').value=$('divisi').value=$('tel').value='';save();renderMem();renderAbsen();};function renderMem(){const el=$('memList');el.innerHTML='';DB.members.forEach(m=>{const d=document.createElement('div');d.className='card';d.innerHTML=`<b></b> <span class="mut"></span><div class="mut tel"></div><div class="row" style="margin-top:8px"><button class="act">Edit</button><button class="act dan">Hapus</button></div>`;d.querySelector('b').textContent=m.nama;d.querySelector('span').textContent=m.divisi||'';d.querySelector('.tel').textContent=telOf(m)||'-';d.querySelectorAll('button')[0].onclick=()=>{const n=prompt('Nama:',m.nama);if(n===null)return;const dv=prompt('Divisi:',m.divisi||'');if(dv===null)return;const t=prompt('No. HP:',telOf(m));if(t===null)return;if(t.trim()&&!/^[0-9+()\-.\s]+$/.test(t.trim())){alert('No. HP tidak valid');return;}m.nama=n.trim()||m.nama;m.divisi=dv.trim();m.tel=cleanTel(t);save();renderMem();renderAbsen();};d.querySelectorAll('button')[1].onclick=()=>{if(!confirm('Hapus '+m.nama+'?'))return;DB.members=DB.members.filter(x=>x.id!==m.id);Object.values(DB.records).forEach(r=>delete r[m.id]);save();renderMem();renderAbsen();};el.appendChild(d);});}let tmp={};function renderAbsen(){const t=$('tgl').value||today();tmp={...(DB.records[t]||{})};const el=$('absenList');el.innerHTML=DB.members.length?'':'<div class="card mut">Belum ada anggota. Tambah di tab Anggota.</div>';const STS=['H','I','S','A'];DB.members.forEach(m=>{if(!tmp[m.id])tmp[m.id]='H';const d=document.createElement('div');d.className='card';const nm=document.createElement('b');nm.textContent=m.nama;const dv=document.createElement('div');dv.className='mut';dv.textContent=(m.divisi||'-')+(telOf(m)?' • '+telOf(m):'');const s=document.createElement('div');s.className='st';STS.forEach(v=>{const b=document.createElement('button');b.textContent=v;b.classList.toggle('s',tmp[m.id]===v);b.onclick=()=>{tmp[m.id]=v;s.querySelectorAll('button').forEach(x=>x.classList.remove('s'));b.classList.add('s');};s.appendChild(b);});d.append(nm,dv,s);el.appendChild(d);});}$('tgl').onchange=renderAbsen;$('allH').onclick=()=>{DB.members.forEach(m=>tmp[m.id]='H');renderAbsen();};$('save').onclick=()=>{const t=$('tgl').value||today();DB.records[t]={...tmp};save();$('saveMsg').textContent='Tersimpan '+t+' ('+Object.keys(tmp).length+' orang)';setTimeout(()=>$('saveMsg').textContent='',2000);};function datesIn(a,b){return Object.keys(DB.records).filter(d=>(!a||d>=a)&&(!b||d<=b)).sort();}function renderRekap(){const ds=datesIn($('d1').value,$('d2').value);if(!ds.length||!DB.members.length){$('rekapOut').innerHTML='<span class="mut">Belum ada data pada rentang ini.</span>';return;}let h='<table><tr><th>Nama</th><th>H</th><th>I</th><th>S</th><th>A</th><th>%</th></tr>';DB.members.forEach(m=>{let c={H:0,I:0,S:0,A:0},n=0;ds.forEach(d=>{const v=(DB.records[d]||{})[m.id];if(v){c[v]++;n++;}});const p=n?Math.round(c.H/n*100):0;const nm=document.createElement('span');nm.textContent=m.nama;h+=`<tr><td>${nm.innerHTML}</td><td>${c.H}</td><td>${c.I}</td><td>${c.S}</td><td>${c.A}</td><td>${p}%</td></tr>`;});h+=`</table><p class="mut">${ds.length} pertemuan: ${ds.join(', ')}</p>`;$('rekapOut').innerHTML=h;}function parseCSV(t){const rows=[];let r=[],v='',q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c==='"'){if(t[i+1]==='"'){v+='"';i++;}else q=false;}else v+=c;}else if(c==='"')q=true;else if(c===','){r.push(v);v='';}else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;r.push(v);rows.push(r);r=[];v='';}else v+=c;}r.push(v);rows.push(r);return rows.filter(x=>x.some(c=>String(c).trim()!==''));}$('impBtn').onclick=()=>{const f=$('impFile').files[0];if(!f)return alert('Pilih file CSV dulu');const rd=new FileReader();rd.onload=()=>{try{const rows=parseCSV(String(rd.result).replace(/^\uFEFF/,''));const known=new Set(DB.members.map(m=>m.nama.toLowerCase()));let add=0,skip=0;rows.forEach((c,ix)=>{let nama=String(c[0]||'').trim();if(ix===0&&/^nama$/i.test(nama))return;const divisi=String(c[1]||'').trim();const tel=cleanTel(c[2]);if(!nama){skip++;return;}if(tel&&!/^[0-9+()\-.\s]+$/.test(tel)){skip++;return;}if(known.has(nama.toLowerCase())){skip++;return;}known.add(nama.toLowerCase());DB.members.push({id:uid(),nama,divisi,tel});add++;});save();renderMem();renderAbsen();$('impFile').value='';$('impMsg').textContent=`Impor selesai: ${add} ditambah, ${skip} dilewati`;setTimeout(()=>$('impMsg').textContent='',4000);}catch(e){alert('CSV tidak valid');}};rd.readAsText(f);};$('bak').onclick=()=>{dl('absen-osis.json',JSON.stringify(DB));};$('exp').onclick=()=>{const ds=Object.keys(DB.records).sort();let rows=[['tanggal','nama','divisi','telepon','status']];ds.forEach(d=>DB.members.forEach(m=>rows.push([d,m.nama,m.divisi||'',telOf(m),(DB.records[d]||{})[m.id]||''])));dl('absen-osis.csv',rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n'),'text/csv');};function dl(n,t,m='application/json'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:m}));a.download=n;a.click();}$('res').onclick=()=>{const f=$('resFile').files[0];if(!f)return alert('Pilih file JSON dulu');const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!Array.isArray(o.members))throw 0;DB=o;save();renderMem();renderAbsen();alert('Restore OK');}catch{alert('File tidak valid');}};r.readAsText(f);};renderMem();renderAbsen();</script></body></html>
